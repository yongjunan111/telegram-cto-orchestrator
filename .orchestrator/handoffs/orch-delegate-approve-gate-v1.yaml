task:
  description: 'Implement delegate_required role-enforcement approve gate V1. CTO
    is in orchestration/review mode only; YOU ARE TEAM LEAD. Use 1-2 internal Agent(sonnet)
    tasklets. NO new external child YAML. Codex-approved design with 9 corrections:
    (C1) NO ''claimed_by'' field — that field doesn''t exist. Use timestamps.claimed_at
    + handoff.to + peer_registry. For approve: fail-closed if handoff.to == cto OR
    resolution.completed_by == cto. (C2) team-lead is a CAPABILITY, not a peer type.
    Look up peer_registry.yaml; require peer with capabilities containing ''team-lead''.
    Reject ''cto'' as delegate owner/completer. (C3) child_handoffs >= 1 completed
    is COMPLETED CHILD LEDGER / WORKER EVIDENCE, not a ''plan''. Plan artifact stays
    optional/doc-only this round. Hard gate uses completed child ledger. (C4) Add
    helper CLI: ''orchctl handoff add-adversarial-review <handoff-id> --reviewer <peer-id>
    --verdict ship-as-is --findings-count N --body-file <path>''. Writes markdown
    under .orchestrator/runtime/adversarial-reviews/<handoff-id>/<UTC-ts>.md with
    strict frontmatter. (C5) Approve gate strictly parses frontmatter: handoff_id
    == current; verdict == ship-as-is; review_target_completed_at == timestamps.completed_at
    exactly; reviewer != assignee AND != completer; path under .orchestrator/runtime/adversarial-reviews/<handoff-id>/.
    (C6) DO NOT rely on mtime as primary freshness. Primary check is frontmatter review_target_completed_at
    == completed_at. mtime optional secondary sanity only. (C7) Verdict handling:
    ONLY ship-as-is passes. needs-fix, reject, empty, unknown all block. (C8) Non-delegate
    handoffs: zero hard-gate burden. Optional review recommendation in docs only.
    (C9) Scope lock: NO V3 idle automation, NO cost optimization, NO V2 archive code
    modification (read-only reference OK). Scope is ONLY role-enforcement gate + evidence
    helper + docs/tests.'
  scope: 'ALLOWED: lib/handoffs.py (approve gate logic + add-adversarial-review subcommand),
    orchctl (subparser wiring + main hookup), tests/test_handoffs.py or new tests/test_delegate_approve_gate.py,
    tests/test_adversarial_review_evidence.py, docs/policy-delegate-required-approve-gate.md
    (NEW). OPTIONAL: lib/storage.py minimal helper if needed for safe markdown write
    under runtime/adversarial-reviews/. FORBIDDEN: lib/session_archive*.py (V2 archive
    — read-only reference OK but no edits), lib/bootstrap.py beyond minimal completion-protocol
    guidance addition (if needed at all), lib/sessions.py, lib/dispatch.py, lib/gc_audit.py,
    lib/idle_snapshot.py, lib/session_cleanup.py, .orchestrator/wiki/**, .orchestrator/handoffs/**,
    .orchestrator/rooms/**.'
  constraints:
  - delegate_required gate enforced. Need >=1 completed child_handoffs entry on THIS
    handoff.
  - 'Trust-but-verify: targeted pytest BEFORE add-subtask. Adversarial pre-review
    BEFORE approve (CTO will run it independently and write the artifact via the new
    helper).'
  - 1-2 internal Agent(sonnet) tasklets only, recorded via add-subtask. NO new external
    child handoff YAML.
  - 'Self-bootstrapping: this handoff itself is delegate_required and must satisfy
    its own gate. orch-v2-archive-lead has team-lead capability already; CTO is reviewer
    (not assignee, not completer).'
  - NO V3 idle archive automation. NO cost/quota optimization. NO V2 archive code
    modification. NO new peer types. NO bootstrap rendering changes beyond minimal
    completion-protocol guidance text.
  acceptance_criteria:
  - 'INVARIANT: delegate_required handoff approve fails-closed when handoff.to ==
    cto OR resolution.completed_by == cto, with structured ''missing: ...'' message
    naming the violation.'
  - 'INVARIANT: delegate_required handoff approve fails-closed when assignee peer
    lacks ''team-lead'' capability in peer_registry.yaml, with structured ''missing:
    ...'' message.'
  - 'INVARIANT: delegate_required handoff approve fails-closed when execution.child_handoffs
    has 0 completed entries (V1 ledger gate preserved).'
  - 'INVARIANT: delegate_required handoff approve fails-closed when no adversarial-review
    markdown artifact exists at .orchestrator/runtime/adversarial-reviews/<handoff-id>/
    matching ALL 5 strict conditions: (a) handoff_id == current, (b) verdict == ship-as-is,
    (c) review_target_completed_at == timestamps.completed_at exactly, (d) reviewer
    != assignee AND != completer, (e) path under .orchestrator/runtime/adversarial-reviews/<handoff-id>/.'
  - 'INVARIANT: verdict handling is exclusive — only ''ship-as-is'' passes; ''needs-fix'',
    ''reject'', empty, and any unknown string block approval with structured message.'
  - 'INVARIANT: freshness check uses frontmatter review_target_completed_at == timestamps.completed_at
    as primary, NOT mtime. mtime may be optional secondary check or unused.'
  - 'INVARIANT: non-delegate handoffs (mode == direct OR delegate_optional OR missing)
    are NOT blocked by this new gate. All existing approve flows for them remain unchanged.'
  - 'Helper CLI works: ''orchctl handoff add-adversarial-review <handoff-id> --reviewer
    <peer-id> --verdict <v> --findings-count <n> --body-file <path>'' writes a markdown
    file at .orchestrator/runtime/adversarial-reviews/<handoff-id>/<UTC-iso-timestamp>.md
    with valid frontmatter (handoff_id, reviewer, review_target_completed_at, verdict,
    findings_count). UTC timestamp comes from current time, review_target_completed_at
    copies handoff''s timestamps.completed_at.'
  - 'Documentation: docs/policy-delegate-required-approve-gate.md exists explaining
    (a) why this gate exists (role-enforcement, V2 churn lessons), (b) 4 evidence
    requirements, (c) artifact format and frontmatter spec, (d) role boundaries (CTO=reviewer,
    team-lead=delegate owner with team-lead capability, worker=child handoff completer),
    (e) why V3 idle archive must wait until this is enforced.'
  - 'Targeted pytest green: new tests in tests/test_delegate_approve_gate.py (or equivalent)
    covering: (T1) no team-lead/worker evidence → fail; (T2) handoff.to==cto OR completed_by==cto
    → fail; (T3) completed child ledger but no review artifact → fail; (T4) review
    artifact stale (review_target_completed_at != completed_at) → fail; (T5) verdict
    != ship-as-is → fail (test all of: needs-fix, reject, empty, unknown); (T6) all
    evidence present → success; (T7) non-delegate handoffs not blocked.'
  - 'Full pytest green: ''uv run pytest tests/ -q'' (>=349 + new tests, no regressions).'
  - Parent execution.child_handoffs has >=1 completed entry; NO new external child
    YAML.
  report_back: 'Telegram chat 8585947943 reply_to 4511: STAGED — (S1) handoff create+dispatch
    ack; (S2) tasklet done + targeted/full pytest; (S3) adversarial pre-review verdict
    + CTO approve note + final state. Final report: changed files, gate logic summary
