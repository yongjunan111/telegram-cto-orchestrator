  - V3 idle archive automation, cron, hooks, cleanup automation.
  - Cost/quota optimization.
  - Modifying V2 archive code (lib/session_archive*.py, tests/test_session_archive*.py).
  - New peer types (team-lead is a capability, not a type).
  - Verifier peer separation, invariant schema separation (deferred separate proposals).
  - Bootstrap rendering rewrite — at most a small text addition pointing to the new
    gate, no schema change.
  - New external child handoff YAML.
  - Auto-running adversarial review (CTO triggers it manually + writes via helper).
  invariants:
  - 'Authoritative-vs-derived split preserved: handoff YAML carries minimal refs/state;
    adversarial review markdown bodies live under .orchestrator/runtime/adversarial-reviews/
    (derived runtime artifact).'
  - delegate_required gate is fail-closed (default deny) for missing evidence; structured
    error messages name the missing condition.
  - Non-delegate approve flow is unchanged (zero burden).
  - Helper CLI uses safe write (containment + symlink-refuse + atomic where applicable).
  - Frontmatter parsing rejects malformed YAML or missing required fields.
  failure_examples: []
  validation:
  - uv run pytest tests/test_delegate_approve_gate.py tests/test_handoffs.py -v after
    tasklet.
  - uv run pytest tests/ -q (full).
  - 'Helper CLI smoke: ''orchctl handoff add-adversarial-review <some-handoff-id>
    --reviewer cto --verdict ship-as-is --findings-count 0 --body-file <tmp>'' writes
