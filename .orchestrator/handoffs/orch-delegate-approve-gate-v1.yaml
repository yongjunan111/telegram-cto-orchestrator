      added _parse_frontmatter (YAML frontmatter parser; rejects malformed/missing
      required fields), _find_valid_adversarial_review (returns first artifact path
      matching all 5 strict conditions or None — handoff_id match, verdict==ship-as-is,
      review_target_completed_at==timestamps.completed_at exactly, reviewer != assignee
      && != completer, path under .orchestrator/runtime/adversarial-reviews/<handoff-id>/),
      cmd_handoff_add_adversarial_review helper (writes md under .orchestrator/runtime/adversarial-reviews/<sid>/<UTC-iso-ts>.md
