    gate /  must ALSO validate artifact reviewer exists in peer_registry (artifacts
    can be hand-written, helper alone insufficient). Keep reviewer != assignee &&
    != completer checks. **F3 [P2] symlink read-side escape**: uses os.path.isdir/listdir/isfile/open
