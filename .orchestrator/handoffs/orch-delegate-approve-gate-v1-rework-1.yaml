    artifacts outside  after realpath resolution. **F4 [P2] same-second overwrite**:
    helper filename uses second precision storage.now_iso(); two writes in same second
    produce identical target_path; safe_write_text os.replace silently overwrites.
    Evidence must be append-only-ish. Use microsecond timestamp or collision suffix
    with exclusive reservation (O_CREAT|O_EXCL retry). Helper-local picker OK; must
    NOT silently overwrite. **Tests**: each fix needs a regression test that FAILS
    on current implementation and PASSES after fix (TDD style). Trust-but-verify before
    add-subtask. CTO will run adversarial pre-review BEFORE approve via the new helper
    itself.'
