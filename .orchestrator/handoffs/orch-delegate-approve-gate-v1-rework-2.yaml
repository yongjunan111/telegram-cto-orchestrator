    Anti-pattern explicitly named: second-order patching (fix A creates/exposes B).
    Required discipline: BEFORE coding, produce a second-order risk map covering each
    fix. NO narrow test-only fixes. If new P1/P2 found mid-implementation: fix in
    scope if same surface (lib/handoffs.py + tests + policy doc) or stop+escalate
    if scope expands. YOU ARE TEAM LEAD. Same pane. 1 cohesive Agent(sonnet) tasklet.
    NO new external child YAML (unless CTO explicitly decides absorption infeasible
    — escalate first). 3 findings: F1 [P2] reservation creates 0-byte placeholder
    OUTSIDE repo when adversarial-reviews root is symlinked. lib/handoffs.py:_reserve_unique_review_path
    lines ~1876-1883 calls os.makedirs + os.open(O_CREAT|O_EXCL) BEFORE safe_write_text
    rejects. Codex reproduced. Required invariant: helper creates ZERO files/dirs
    outside intended .orchestrator/runtime/adversarial-reviews/<hid>/ tree, even when
    adversarial-reviews OR any child component is a symlink. Implementation guidance:
    dirfd/openat descent from storage.RUNTIME_DIR with O_NOFOLLOW per component (pattern
    matches lib/session_archive_report.py:_open_or_create_dir_nofollow which already
    exists in this repo — read it for reference). O_CREAT|O_EXCL on final filename
    via dir_fd. Reservation+write must be one safe op OR reservation only after every
    parent is anchored. F2 [P2] stale artifact bypass. lib/handoffs.py:_find_valid_adversarial_review
    lines ~1854-1857 checks frontmatter review_target_completed_at == completed_at
    but NOT artifact mtime. Codex reproduced approve passing with artifact mtime ONE
    HOUR BEFORE completed_at (frontmatter copied). Required invariant: artifact st_mtime
    strictly > handoff.timestamps.completed_at (UTC). Frontmatter equality check kept
    (additional, not replacement). Malformed completed_at parse fails closed (no crash).
    Compare in UTC throughout. F3 [P3] owned_files=[''''] passes. lib/handoffs.py
    approve gate lines ~1389-1391 checks len(owned_files)>0 only. Required invariant:
    every completed child counted by gate must have owned_files as non-empty list
    of non-empty strings after strip. Blank, whitespace, None, numbers, mixed invalid
    entries fail-closed with message naming child id + owned_files. Strict policy:
    fail if ANY entry invalid (not merely ''at least one valid''). MANDATORY second-order
    risk map (in completion report): for each fix list (a) exact bug, (b) likely new
    failure modes the fix could introduce, (c) regression tests catching those new
    modes, (d) constraint preventing narrow test-only fixes, (e) any discovered follow-on
    issue: in-scope or escalate.'
