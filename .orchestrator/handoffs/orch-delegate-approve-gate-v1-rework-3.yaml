task:
  description: 'REWORK-3 of approve-gate. Codex reproduced P2: _write_adversarial_review_atomic
    does direct O_CREAT|O_EXCL on final .md path. If os.write/os.fsync fails AFTER
    writing complete frontmatter but BEFORE body finishes, helper exits 1 BUT leftover
    partial .md at final artifact path stays approveable (frontmatter parses + reader
    accepts). Approve passes on FAILED helper run. Codex monkeypatched os.write to
    write only frontmatter then raise OSError; orchctl handoff approve still succeeded.
    This violates the gate. YOU ARE TEAM LEAD. Same pane. 1 cohesive Agent(sonnet)
    tasklet. NO new external child YAML. **MANDATORY before coding: publication-state
    risk map.** For each fix candidate, list: (1) states before write / during write
    / after fsync / after publish; (2) every failure point + what remains on disk;
    (3) whether approve can see that remainder; (4) how impl prevents leftover valid
    artifacts; (5) regression tests covering failure paths. **Required invariant**:
    add-adversarial-review must be all-or-nothing from approve''s point of view. Success
    → exactly ONE final .md with full content + valid frontmatter. Failure before
    publish → NO final artifact. Failure after creating temp/staging file → temp/staging
    unlinked OR has name/extension/location reader will NEVER consider. Approve must
    NEVER accept artifact from failed helper run. **Preferred design (Option A)**:
    temp file + atomic publish under dirfd. (a) dirfd descent with O_NOFOLLOW exactly
    as rework-2. (b) Create temp/staging in per-handoff dir with O_CREAT|O_EXCL|O_WRONLY|O_NOFOLLOW,
    name does NOT end in .md (e.g. .<timestamp>.md.tmp.<pid>.<counter>). (c) Write
    full content, fsync file, close. (d) Atomically publish to final <timestamp>[-N].md
    via os.rename or dir_fd rename ONLY after success. (e) Preserve same-second collision
    retry. (f) fsync directory if feasible. (g) On any error before publish: unlink
    temp; final .md must not exist. **Option B less preferred** (direct final + cleanup):
    if O_CREAT|O_EXCL kept on final, any write/fsync exception MUST unlink final via
    dir_fd. Cleanup can fail itself, weaker than A. Justify if chosen. **My recommendation:
    Option A.** Reader (_find_valid_adversarial_review) must continue to ignore non-.md
    files (temp/staging files) — verify it iterates only .md files (already does).
    Same-second behavior MUST be preserved (rework-1 F4 invariant). Above-RUNTIME
    ancestor symlinks MUST keep succeeding (rework-2 F1 invariant). Mid-implementation
    discovery: same surface (lib/handoffs.py + tests + policy) = fix in scope; expanding
    scope = stop+escalate.'
  scope: 'ALLOWED: lib/handoffs.py, tests/test_delegate_approve_gate.py, docs/policy-delegate-required-approve-gate.md
    (small publication-state note if needed). FORBIDDEN: V2 archive code, V3 idle,
